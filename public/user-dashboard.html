



<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-image: url('css/dashboard-bg.jpg');
            background-size: 100% 100%;
            background-attachment: fixed;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
            align-items: start;
        }
        .soon-box {
            background-color: rgba(236, 240, 241, 0.8);
            border: 2px dashed #bdc3c7;
            height: 250px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7f8c8d;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 25px;
            letter-spacing: 2px;
            position: relative;
        }
        .soon-box::after { content: "الاعلانات...."; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
        .goal-divider {
            margin: 20px 0;
            border-top: 1px solid #eee;
            position: relative;
        }
        .goal-divider::before {
            content: "أو";
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 0 10px;
            color: #aaa;
            font-size: 12px;
        }
        .goal-header-small {
            font-size: 14px;
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: bold;
            display: block;
        }
        .tips-container {
            background: linear-gradient(135deg, #2c3e50, #4ca1af);
            color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .tip-icon { font-size: 30px; margin-bottom: 10px; }
        .tip-text { font-size: 16px; line-height: 1.6; font-weight: 500; animation: fadeIn 1s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .status-msg {
            margin-top: 10px;
            font-size: 13px;
            font-weight: bold;
            display: none;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            animation: fadeIn 0.3s;
            clear: both; 
        }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand"> Smart Expense Pro</div>
        <div class="nav-links">
            <a href="user-dashboard.html" class="active">الرئيسية</a>
            <a href="reports.html">التقارير</a>
            <a href="profile.html">الملف الشخصي</a>
            <a href="#" onclick="logout()" class="logout-btn">خروج</a>
        </div>
    </nav>

    <div class="container">
        <div style="margin-bottom: 30px;">
            <h2 id="welcome-msg" style="color: #2c3e50;">مرحباً بك 👋</h2>
            <p style="color: #7f8c8d;">لنبدأ بتنظيم أموالك اليوم!</p>
        </div>

        <div class="dashboard-grid">
            
            <div class="main-column">
                
                <div class="card-box" style="margin-bottom: 25px;">
                    <h3> تسجيل دخل جديد</h3>
                    <div class="form-group"><label>المبلغ</label><input type="number" id="inc-amount" placeholder="0.00"></div>
                    <div class="form-group"><label>المصدر</label>
                        <select id="inc-source">
                            <option value="الراتب الشهري">الراتب الشهري</option>
                            <option value="عمل حر">عمل حر</option>
                            <option value="مكافأة">مكافأة</option>
                            <option value="أخرى">أخرى</option>
                        </select>
                    </div>
                    <div class="form-group"><label>التاريخ</label><input type="date" id="inc-date"></div>
                    
                    <button onclick="addIncome()" class="btn-primary btn-green">إضافة الدخل</button>
                    <div id="msg-income" class="status-msg"></div>
                </div>

                <div class="card-box" style="margin-bottom: 25px;">
                    <h3> تسجيل مصروف جديد</h3>
                    <div class="form-group"><label>المبلغ</label><input type="number" id="exp-amount" placeholder="0.00"></div>
                    <div class="form-group"><label>التصنيف</label>
                        <select id="exp-category">
                            <option value="طعام">طعام</option>
                            <option value="مواصلات">مواصلات</option>
                            <option value="فواتير">فواتير</option>
                            <option value="تسوق">تسوق</option>
                            <option value="صحة">صحة</option>
                            <option value="أخرى">أخرى</option>
                        </select>
                    </div>
                    <div class="form-group"><label>الوصف</label><input type="text" id="exp-desc" placeholder="تفاصيل..."></div>
                    <div class="form-group"><label>التاريخ</label><input type="date" id="exp-date"></div>
                    
                    <button onclick="addExpense()" class="btn-primary btn-orange">إضافة المصروف</button>
                    <div id="msg-expense" class="status-msg"></div>
                </div>

                <div class="card-box">
                    <h3> هدفي الادخاري</h3>
                    
                    <div>
                        <span class="goal-header-small">1️⃣ إنشاء هدف جديد</span>
                        <div style="display:flex; gap:10px; margin-bottom:10px;">
                            <input type="text" id="new-goal-name" placeholder="اسم الهدف" style="flex:1;">
                            <input type="number" id="new-goal-target" placeholder="المبلغ المستهدف" style="flex:1;">
                        </div>
                        <button onclick="createNewGoal()" class="btn-primary btn-blue" style="margin-top:0;">حفظ الهدف</button>
                        <div id="msg-new-goal" class="status-msg"></div>
                    </div>

                    <div class="goal-divider"></div>

                    <div>
                        <span class="goal-header-small">2️⃣ إضافة رصيد لهدف حالي</span>
                        <div class="form-group">
                            <select id="goal-select">
                                <option value="">جاري تحميل الأهداف...</option>
                            </select>
                        </div>
                        <div style="display:flex; gap:10px;">
                            <input type="number" id="goal-add-amount" placeholder="المبلغ المضاف للرصيد" style="flex:2;">
                            <button onclick="addToGoal()" class="btn-primary btn-green" style="flex:1; margin:0;">إضافة</button>
                        </div>
                        <div id="msg-add-balance" class="status-msg"></div>
                    </div>
                </div>

            </div>

            <div class="side-column">
                <div class="soon-box"></div>
                <div class="tips-container">
                    <div class="tip-icon">💡</div>
                    <div id="tip-text" class="tip-text">...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const userID = localStorage.getItem('userID');
        const userName = localStorage.getItem('userName');
        if (!userID) window.location.href = 'index.html';

        document.getElementById('welcome-msg').textContent =` مرحباً بك، ${userName || 'يا غالي'} 👋`;
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('inc-date').value = today;
        document.getElementById('exp-date').value = today;

        
        function showMessage(elementId, message, isSuccess = true) {
            const el = document.getElementById(elementId);
            if (!el) { console.error("Message element not found: " + elementId); return; }
            
            el.textContent = message;
            el.className = isSuccess ? 'status-msg success' : 'status-msg error';
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }

        async function addIncome() {
            const amount = document.getElementById('inc-amount').value;
            const source = document.getElementById('inc-source').value;
            const date = document.getElementById('inc-date').value;
            if(!amount || !date) return showMessage('msg-income', 'الرجاء تعبئة الحقول', false);
            
            try {
                const res = await fetch('/api/add-income', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userID, amount, source, date })
                });
                const data = await res.json();
                if(data.success) { 
                    showMessage('msg-income', '✅ تم إضافة الدخل بنجاح'); 
                    document.getElementById('inc-amount').value = ''; 
                }
            } catch(e) { console.error(e); }
        }

        async function addExpense() {
            const amount = document.getElementById('exp-amount').value;
            const category = document.getElementById('exp-category').value;
            const desc = document.getElementById('exp-desc').value;
            const date = document.getElementById('exp-date').value;
            if(!amount || !date) return showMessage('msg-expense', 'الرجاء تعبئة الحقول', false);
            
            try {
                const res = await fetch('/api/add-expense', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userID, amount, category, description: desc, date })
                });
                const data = await res.json();
                if(data.success) { 
                    showMessage('msg-expense', '✅ تم تسجيل المصروف'); 
                    document.getElementById('exp-amount').value = ''; 
                    document.getElementById('exp-desc').value = ''; 
                }
            } catch(e) { console.error(e); }
        }

        async function loadGoalsForDropdown() {
            try {
                
                const res = await fetch('/api/goals/' + userID + '?t=' + new Date().getTime());
                const goals = await res.json();
                const select = document.getElementById('goal-select');
                
                select.innerHTML = '<option value="">اختر الهدف من هنا...</option>';
                if(goals.length === 0) {
                    select.innerHTML += '<option value="" disabled>لا توجد أهداف، أنشئ واحداً بالأعلى</option>';
                }
                
                goals.forEach(g => {
                    const option = document.createElement('option');
                    option.value = g.goalID;
                    const remaining = g.targetAmount - g.currentAmount;
                    option.text =` ${g.goalName} (باقي: ${remaining})`;
                    select.appendChild(option);
                });
            } catch(e) { console.error(e); }
        }

        async function createNewGoal() {
            const name = document.getElementById('new-goal-name').value;
            const target = document.getElementById('new-goal-target').value;
            if(!name || !target) return showMessage('msg-new-goal', 'الرجاء تعبئة الحقول', false);
            
            try {
                const res = await fetch('/api/add-goal', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userID, goalName: name, targetAmount: target })
                });
                const data = await res.json();
                if(data.success) {
                    showMessage('msg-new-goal', '✅ تم حفظ الهدف الجديد');
                    document.getElementById('new-goal-name').value = '';
                    document.getElementById('new-goal-target').value = '';
                    loadGoalsForDropdown(); 
                }
            } catch(e) { console.error(e); }
        }

        async function addToGoal() {
            const goalID = document.getElementById('goal-select').value;
            const amount = document.getElementById('goal-add-amount').value;
            
            if(!goalID) return showMessage('msg-add-balance', 'اختر الهدف أولاً', false);
            if(!amount) return showMessage('msg-add-balance', 'ادخل المبلغ', false);
            
            try {
                const res = await fetch('/api/add-savings/' + goalID, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amountToAdd: amount })
                });
                const data = await res.json();
                if(data.success) {
                    
                    showMessage('msg-add-balance', '✅ تمت إضافة الرصيد بنجاح');
                    document.getElementById('goal-add-amount').value = '';
                    loadGoalsForDropdown(); 
                }
            } catch(e) { console.error(e); }
        }

        const tips = [
            "قاعدة 50/30/20: 50% احتياجات، 30% رغبات، 20% ادخار.",
            "ادخر للطوارئ دائماً.",
            "تجنب الديون الاستهلاكية.",
            "استثمر مبكراً لزيادة ثروتك.",
            "سجل مصاريفك يومياً.",
            "قارن الأسعار قبل الشراء.",
            "لا تتسوق وأنت جائع.",
            "راجع اشتراكاتك الشهرية.",
            "ضع أهدافاً مالية واضحة.",
            "كافئ نفسك بذكاء."
        ];
        let tipIndex = 0;
        function rotateTips() {
            const el = document.getElementById('tip-text');
            el.style.animation = 'none';
            el.offsetHeight; 
            el.style.animation = null; 
            el.textContent = tips[tipIndex];
            tipIndex = (tipIndex + 1) % tips.length;
        }
        setInterval(rotateTips, 5000);
        rotateTips();

        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        loadGoalsForDropdown();
    </script>
</body>
</html>

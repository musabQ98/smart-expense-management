


<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة كلمة المرور</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-image: url('css/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .landing-container {
            background: rgba(44, 62, 80, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
            text-align: center;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
        }

        h1 { margin-bottom: 10px; color: #f39c12; }
        .subtitle { color: #bdc3c7; margin-bottom: 30px; font-size: 16px; }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ffffff;
            font-weight: bold;
            font-size: 16px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
            font-size: 16px;
            box-sizing: border-box;
        }

        .btn-primary {
            background-color: #f39c12;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background-color: #d35400;
        }

        .back-link {
            display: block;
            margin-top: 25px;
            font-size: 14px;
            color: #f39c12;
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="landing-container">
        <h1>استعادة كلمة المرور</h1>
        <p class="subtitle">للأمان، يرجى تأكيد هويتك لتغيير كلمة المرور</p>

        <form id="resetForm">
            <div class="form-group">
                <label>البريد الإلكتروني المسجل</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>

            <div class="form-group">
                <label>الاسم الكامل (للمطابقة)</label>
                <input type="text" id="name" required placeholder="أدخل اسمك المسجل لدينا">
            </div>

            <div class="form-group">
                <label>كلمة المرور الجديدة</label>
                <input type="password" id="newPassword" required placeholder="****">
            </div>

            <button type="submit" class="btn-primary">حفظ كلمة المرور الجديدة</button>
            
            <div id="messageBox" style="margin-top: 15px; font-size: 14px; display: none;"></div>
        </form>

        <a href="user-login.html" class="back-link">عودة لصفحة الدخول</a>
    </div>

    <script>
        const messageBox = document.getElementById('messageBox');

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            messageBox.style.display = 'none';
            messageBox.textContent = '';

            const email = document.getElementById('email').value;
            const name = document.getElementById('name').value;
            const newPassword = document.getElementById('newPassword').value;

            try {
                const response = await fetch('/api/reset-password', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, name, newPassword })
                });

                const data = await response.json();

                messageBox.style.display = 'block';

                if (data.success) {
                    messageBox.style.color = '#2ecc71';
                    messageBox.textContent = '✅ ' + data.message;
                    
                    // تحويل المستخدم لصفحة الدخول بعد ثانيتين
                    setTimeout(() => {
                        window.location.href = 'user-login.html';
                    }, 2000);
                } else {
                    messageBox.style.color = '#e74c3c';
                    messageBox.textContent = '❌ ' + data.message;
                }

            } catch (error) {
                console.error('Error:', error);
                messageBox.style.display = 'block';
                messageBox.style.color = '#e74c3c';
                messageBox.textContent = 'حدث خطأ في الاتصال بالسيرفر';
            }
        });
    </script>

</body>
</html>

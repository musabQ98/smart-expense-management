


<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة المحتوى</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { 
            background-color: #f5f7fa; 
            font-family: sans-serif; 
            margin: 0; 
        }
        .header { 
            background-color: #8e44ad; 
            color: white; 
            padding: 15px 30px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .main-container { 
            max-width: 1200px; 
            margin: 30px auto; 
            padding: 0 20px; 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
        }
        .full-width { 
            grid-column: span 2; 
        }
        
        .box { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            margin-bottom: 20px; 
        }
        h3 { 
            margin-top: 0; 
            color: #8e44ad; 
            border-bottom: 2px solid #ddd; 
            padding-bottom: 10px; 
        }

        input, textarea { 
            width: 100%; 
            padding: 10px; 
            margin-bottom: 10px; 
            border: 1px solid #ddd; 
            border-radius: 4px; 
            box-sizing: border-box; 
        }
        .btn { 
            padding: 10px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            color: white; 
            font-weight: bold; 
            width: 100%; 
        }
        .btn-add { background-color: #8e44ad; }
        .btn-del { background-color: #c0392b; width: auto; padding: 5px 10px; font-size: 12px; }
        
        .item-list { list-style: none; padding: 0; max-height: 250px; overflow-y: auto; }
        .item-list li { background: #f9f9f9; border-bottom: 1px solid #eee; padding: 10px; display: flex; justify-content: space-between; align-items: center; }

        /* نافذة الحالة */
        #statusModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 2000; }
        .status-content { background: white; padding: 25px; width: 350px; border-radius: 10px; text-align: center; }
        .status-icon { font-size: 40px; display: block; margin-bottom: 10px; }
        .status-msg { font-size: 18px; font-weight: bold; margin-bottom: 20px; display: block; }
    </style>
</head>
<body>

    <div class="header">
        <h2> إدارة المحتوى</h2>
        <div>
            <span id="empName">...</span>
            <button onclick="logout()" class="btn" style="background:#c0392b; width:auto; margin-right:10px;">خروج</button>
        </div>
    </div>

        <div class="box full-width">
            <h3> رفع تقرير للإدارة</h3>
            <input type="text" id="reportSubject" placeholder="عنوان التقرير">
            <textarea id="reportContent" style="height: 100px;" placeholder="محتوى التقرير..."></textarea>
            <button onclick="sendReport()" class="btn" style="background:#2c3e50;">إرسال التقرير</button>
        </div>

    </div>

    <div id="statusModal">
        <div class="status-content">
            <span id="statusIcon" class="status-icon"></span>
            <span id="statusMsg" class="status-msg"></span>
            <button onclick="document.getElementById('statusModal').style.display='none'" class="btn" style="background:#34495e;">حسناً</button>
        </div>
    </div>

    <script>
        const empID = localStorage.getItem('empID');
        if (!empID) window.location.href = 'index.html';
        document.getElementById('empName').textContent = 'الموظف: ' + localStorage.getItem('empName');

        function showStatus(msg, isSuccess) {
            const modal = document.getElementById('statusModal');
            const icon = document.getElementById('statusIcon');
            const text = document.getElementById('statusMsg');
            text.textContent = msg;
            icon.textContent = isSuccess ? "✅" : "❌";
            text.style.color = isSuccess ? "#27ae60" : "#c0392b";
            modal.style.display = 'flex';
        }

       
        async function sendReport() {
            const subject = document.getElementById('reportSubject').value;
            const content = document.getElementById('reportContent').value;
            if(!subject || !content) return showStatus("أكمل بيانات التقرير.", false);

            const res = await fetch('/api/submit-report', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ employeeID: empID, subject, content })
            });
            const result = await res.json();
            if(result.success) {
                showStatus("تم إرسال التقرير ✅", true);
                document.getElementById('reportSubject').value = '';
                document.getElementById('reportContent').value = '';
            } else showStatus("فشل الإرسال", false);
        }

        function logout() { localStorage.clear(); window.location.href = 'index.html'; }

        loadAds();
        loadTips();
    </script>
</body>
</html>
